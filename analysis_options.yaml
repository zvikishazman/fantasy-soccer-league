analyzer:
  exclude:
    - build/**
  language:
    strict-casts: true
    strict-inference: true
  errors:
    avoid_print: error
    dead_code: warning
    missing_required_param: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - sort_constructors_first
    - use_key_in_widget_constructors
